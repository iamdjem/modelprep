# GitHub Pages deploy for the React frontend in deploy/.
# Builds only that subdirectory; backend/ and cdn/ deploy separately to
# Cloudflare (see ARCHITECTURE.md "Deploy & commit map").
#
# Note for future changes: GitHub only reads workflows from .github/ at the
# REPO ROOT, so this file must live here even though all its actions target
# the deploy/ subdir.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    # Skip when only backend/ or cdn/ changed — nothing for Pages to rebuild.
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: deploy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build
          cp dist/index.html dist/404.html
        env:
          # Must match the GitHub Pages repo path (iamdjem.github.io/modelprep/).
          # If the repo is renamed, change here AND on Worker CORS allow-list.
          VITE_BASE: /modelprep/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
